services:
  mysql:
    image: mysql:8.0
    container_name: claro_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${DB_NAME:-claro_tasks_db}
      MYSQL_USER: ${DB_USER:-clarouser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-claropassword}
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
